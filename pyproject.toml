[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openproof"
version = "0.1.0"
description = "OpenProof mainline training and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["rfdetr==1.9.3", "torch>=2.6", "torchvision>=0.21", "numpy>=1.26,<3", "scipy>=1.12", "Pillow>=10", "PyYAML>=6", "pycocotools==2.0.8"]

[project.scripts]
openproof = "openproof.__main__:main"

[tool.setuptools.packages.find]
include = ["openproof*"]

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
